[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handball-computer-vision"
version = "0.1.0"
description = "Player detection, team classification, tracking, and court mapping for handball video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "supervision==0.30.0",
    "tqdm>=4.67",
    "transformers>=4.57,<5",
    "umap-learn>=0.5.9",
]

[project.optional-dependencies]
pipeline = [
    "easyocr==1.7.2",
    "hydra-core>=1.3",
    "inference==0.62.0",
    "python-dotenv>=1.0",
    "trackers[mask]==2.6.0",
]
jersey-parseq = [
    # For `--reader parseq`. The model code itself is an external baudm/parseq
    # checkout (see requirements.txt), not a package.
    "pytorch-lightning>=2.0",
    "nltk>=3.9",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
addopts = "-ra"
norecursedirs = [
    "onnxruntime",
    "sam3",
    "segment-anything-2-real-time",
]
